name: CI

on:
  push:
    branches: [main]
  pull_request:

# A CI csak olvas: a tokenje ne tudjon a repóba írni.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (lint és tesztek)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # gofmt + go vet, build, tesztek - ugyanaz, mint helyben a `make check`.
      - run: make check
